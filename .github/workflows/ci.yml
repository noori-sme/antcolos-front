name: CI

on:
  pull_request:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Branch follows <type>/<scope>-<slug> (CONTRIBUTING.md → Branches)
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|perf|test|build|ci|style|revert)/[a-z0-9]+(-[a-z0-9]+)+$'
          if [[ "$BRANCH" =~ $pattern ]] && (( ${#BRANCH} <= 60 )); then
            echo "ok: $BRANCH"; exit 0
          fi
          # Release PRs (staging → main) and dependency bots.
          if [[ "$BRANCH" == "staging" || "$BRANCH" == dependabot/* ]]; then echo "ok: $BRANCH"; exit 0; fi
          echo "::error::Branch '$BRANCH' does not follow <type>/<scope>-<slug>, e.g. feat/loads-ratecon-review or fix/auth-individual-sign-in. Rename it (git branch -m <new-name>, push it, reopen the PR from it). See CONTRIBUTING.md → Branches."
          exit 1

  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Lint is NOT green yet (see docs/workflow/WORKFLOW.md §Baseline), so it
      # reports without blocking. Delete `continue-on-error` once it is clean.
      - run: npm run lint
        continue-on-error: true
      # The unit and node suites are green and block merges.
      - run: npx vitest run
      - run: npm run test:node
      - run: npm run build

  browser:
    name: Browser specs (desktop, mock mode, ${{ matrix.shard }}/6)
    # Manual only (Actions → CI → Run workflow), by owner decision 2026-11-24:
    # it ran on every PR into main, never blocked a merge (continue-on-error),
    # and cost ~80–120 runner minutes per push. Run it before risky UI changes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop --shard=${{ matrix.shard }}/6
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Lint and the unit/node suites are NOT green on staging yet (see
      # docs/workflow/WORKFLOW.md §Baseline). They report without blocking until the
      # baseline is cleared — then delete the `continue-on-error` lines.
      - run: npm run lint
        continue-on-error: true
      - run: npx vitest run
        continue-on-error: true
      - run: npm run test:node
        continue-on-error: true
      - run: npm run build

  browser:
    name: Browser specs (desktop, mock mode)
    # Slow; run on PRs into main (releases) and on demand.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
